name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run omega-pac tests
        run: cd omega-pac && pnpm test

      - name: Run omega-target tests
        run: cd omega-target && pnpm test

      - name: Build all modules
        run: pnpm build

      - name: Build release package (Chrome)
        run: cd omega-target-chromium-extension && BUILD=release pnpm build
        env:
          BUILD: release

      - name: Package release ZIP
        run: cd omega-target-chromium-extension && node scripts/release.js

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchyOmega-release
          path: omega-target-chromium-extension/release.zip
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchyOmega-build
          path: omega-target-chromium-extension/build/
